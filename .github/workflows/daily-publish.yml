name: Publicación diaria en Instagram

on:
  schedule:
    # Comproba cada 20 minutos entre as 10:00 e as 22:00 UTC (cobre as 13:00 e as 19:00
    # hora de España en verán e inverno, con marxe). O script só publica se xa chegou a
    # hora obxectivo e aínda non se publicou ese post — así, aínda que algún disparo do
    # cron de GitHub chegue tarde (é habitual, non son puntuais), o seguinte disparo
    # próximo colle a publicación pendente en vez de perdela todo o día.
    - cron: "*/20 10-21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data a publicar (AAAA-MM-DD). Baleiro = hoxe."
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 scripts/publish_daily.py ${{ github.event.inputs.date }}

      - name: Commit do estado (PUBLICADO)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add publicacions/
          git diff --cached --quiet || (git commit -m "Marcar publicación como publicada [skip ci]" && git push)
